name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Check Skir code formatting
      run: npx skir format --ci

    - name: Run Skir code generation
      run: npx skir gen

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Check Kotlin code formatting
      working-directory: ./backend
      run: ./gradlew ktlintCheck

    - name: Build and test backend
      working-directory: ./backend
      run: ./gradlew build

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
